name: Release

# Publishes to PyPI, and only when someone starts it by hand (Actions -> Release ->
# Run workflow, choosing a version tag). Tags and GitHub releases never trigger it:
# a PyPI upload makes the source public and a version number can't be reused, so
# it stays a deliberate step. Nothing is published to PyPI yet.
on:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tags can be moved).
jobs:
  build:
    # must be run from a version tag, not a branch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "dist/nvpulse-${TAG#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nvpulse/
    # Trusted publishing (OIDC): PyPI checks that the upload comes from this
    # workflow in this repo, so no API token is stored anywhere. This is the only
    # job with more than read access, and it runs no code from the repo.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
