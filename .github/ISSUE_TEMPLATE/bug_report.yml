name: Bug report
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots help a lot for visual issues.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `nvpulse ...`
        2. Press ...
  - type: input
    id: version
    attributes:
      label: nvpulse version
      placeholder: output of `nvpulse --version`
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Snapshot (`nvpulse --dump`)
      description: |
        Paste the output of `nvpulse --dump`, run while the problem is showing if you can.
        It covers versions, driver and every reading from each GPU, and leaves out host names,
        GPU UUIDs, PIDs, user names and command lines, so it is safe to post here.
        Have a look before pasting if you want to be sure.
      render: json
  - type: textarea
    id: gpus
    attributes:
      label: GPUs and driver
      description: |
        Only needed if `--dump` doesn't work: the GPU model(s) and the driver version from `nvidia-smi`.
        Please leave out the GPU UUIDs that `nvidia-smi -L` prints.
      render: text
  - type: input
    id: terminal
    attributes:
      label: Terminal, font and OS
      placeholder: e.g. kitty 0.36 / JetBrains Mono / Ubuntu 24.04, inside tmux
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      render: text
